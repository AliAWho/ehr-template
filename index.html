<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EHR Template Editor - Enhanced</title>
    <style>
        :root {
            --bg-main: #121212;
            --bg-panel: #1e1e1e;
            --text-main: #e0e0e0;
            --accent: #f8cd46;
            --accent-hover: #ffd966;
            --border: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        h1, h2, h3 { color: var(--accent); margin-top: 0; }
        
        .panel {
            background-color: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .full-width { grid-column: span 2; }
        @media (max-width: 800px) { .container, .full-width { grid-template-columns: 1fr; grid-column: span 1; } }

        label { font-weight: bold; display: block; margin-bottom: 5px; color: #aaa; font-size: 14px; }
        
        textarea, input[type="text"] {
            width: 100%;
            background-color: #0a0a0a;
            color: #fff;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 10px;
            font-family: 'Consolas', monospace;
            box-sizing: border-box;
            resize: vertical;
        }

        textarea { min-height: 120px; }

        .gradient-tool {
            display: flex;
            gap: 15px;
            align-items: flex-end;
            margin-bottom: 10px;
        }

        .gradient-options {
            display: flex;
            gap: 20px;
            align-items: center;
            margin-bottom: 15px;
            background: #2a2a2a;
            padding: 10px 15px;
            border-radius: 6px;
        }

        .gradient-options label {
            margin: 0;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .color-picker { display: flex; flex-direction: column; }
        
        input[type="color"] {
            background: none; border: none; height: 40px; width: 60px; cursor: pointer;
        }

        button {
            background-color: var(--accent);
            color: #000;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            height: 40px;
        }
        button:hover { background-color: var(--accent-hover); }

        .preview-box {
            background-color: #000;
            color: #fff;
            padding: 15px;
            border-radius: 6px;
            min-height: 120px;
            font-family: Arial, sans-serif; /* Among Us-like */
            white-space: pre-wrap;
            border: 2px dashed #444;
            overflow-y: auto;
            max-height: 400px;
        }

        .raw-output {
            background-color: #000;
            color: #4dff00;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="panel full-width">
            <h1>EHR Template Editor</h1>
            <p>Edit your Endless Host Roles templates here. Live preview automatically parses Unity Rich Text (`&lt;color&gt;`, `&lt;size&gt;`, `&lt;b&gt;`).</p>
        </div>

        <!-- Gradient Generator Panel -->
        <div class="panel full-width">
            <h2>🎨 Unity Gradient Generator</h2>
            <div class="gradient-tool">
                <div style="flex-grow: 1;">
                    <label>Text to Gradientize</label>
                    <input type="text" id="grad-text" placeholder="Type text here (e.g. ENDLESS HOST ROLES)">
                </div>
                <div class="color-picker">
                    <label>Start</label>
                    <input type="color" id="grad-c1" value="#ff0000">
                </div>
                <div class="color-picker">
                    <label>End</label>
                    <input type="color" id="grad-c2" value="#0000ff">
                </div>
            </div>
            
            <!-- NEW FORMATTING TOGGLES -->
            <div class="gradient-options">
                <label><input type="checkbox" id="grad-bold"> <b>Bold</b></label>
                <label><input type="checkbox" id="grad-italic"> <i>Italic</i></label>
                <label>Size: <input type="text" id="grad-size" placeholder="e.g. 130%" style="width: 80px; padding: 5px; height: 30px; margin-left: 5px;"></label>
                <button onclick="generateGradient()" style="margin-left: auto;">Generate Tag</button>
            </div>

            <textarea id="grad-output" rows="3" readonly placeholder="Your formatted <color=#HEX>g</color><color=#HEX>r</color>adient will appear here..."></textarea>
        </div>

        <!-- Left Column: Editors -->
        <div class="panel">
            <h2>✏️ Edit Fields</h2>
            
            <label>Welcome Template</label>
            <textarea id="val-welcome" oninput="updateAll()"><size=130%><b>Welcome, Cubs!</b></size>\nThis is a <color=#8c4a4a>modded</color> lobby hosted by Pandaville's staff!\n\nCommands\n/r → Show all active roles and gamemodes.\n/r [role] → Get all info for a role.</textarea>

            <label style="margin-top: 15px;">OnMeeting Template</label>
            <textarea id="val-meeting" oninput="updateAll()"><size=70%><b>/cmd m</b> → See what your role does\n<b>/cmd r</b> → Show all active roles\n<b>/cmd r <color=#ff0000>[role name]</color></b> → Show description & settings for that role\n<b>/cmd guess <color=#0000ff>[ID]</color> <color=#ff0000>[role name]</color></b> → Guess that player's role</size></textarea>

            <label style="margin-top: 15px;">Help Template</label>
            <textarea id="val-help" oninput="updateAll()"><size=110%><b><color=#ffc0cb>ENDLESS HOST ROLES</color>\nQUICK GUIDE<size=50%>\n(Guide by <color=#b700ff>@fluxwux</color> on Discord)\n<size=30%>Take notes, class.\n\n<size=80%>EHR is a pretty complicated mod, but don't worry! I'm here to teach you all the basics of the game so you can become the best player there is! First off, let's start with the most integral part of the mod...\n\n<size=100%><color=#4dff00>ROLES</color>\n<size=80%></b>Each player will be assigned a role at the start of the game. There are 4 role types. <b><color=#ff1919>Impostor</color>, <color=#8cffff>Crewmate</color>, <color=#ffab1b>Neutral</color>, & <color=#ff9ace>Add-Ons</color></b><size=70%>.\n\n<size=80%><b><color=#ff1919>Impostors</color> & <color=#8cffff>Crewmates</b>\n<size=60%></color>Self explanatory. These roles are given to the impostors or crewmates.\n\n<b><size=80%><color=#ffab1b>Neutrals</color></b>\n<size=60%><b>This isn't a team. These roles are for any roles that don't side with the impostors or crewmates.</b> Usually, they work alone toward a goal, depending on what their role does.\n\n<size=80%><b><color=#ff9ace>Add-Ons</color><size=60%>\nAdd-Ons are roles that you can get on top of your team role.</b>Usually, they provide minor benefits.\n\n<size=100%><color=#204d42>CHAT COMMANDS\n<size=80%></b>Chat commands</color> are a very useful asset, and each one has its own very useful effect.\n\n<size=73%>/m:</b> Explains your role and Add-On(s) in detail.\n<b>/r [role name]:</b> Shows you what any role in the game does.\n\n<size=100%><b><color=#f8cd46>GUESSING<size=80%></b>\nGuessing</color>, or variants of guessing, are abilities that can be used by a select few roles.\n\n<size=90%><b>HOW TO <color=#f8cd46>GUESS</color>\n<size=60%></b>This guide will show the most common way to guess using the /bt command.\n\n<size=80%><b>#1. Figure out the player's role\n#2. Type /id\n#3. Type /bt [player ID] [role}\n\n<size=80%><b>Now go out there and win some games!</textarea>
        </div>

        <!-- Right Column: Previews -->
        <div class="panel">
            <h2>👁️ Live Preview</h2>
            
            <label>Preview: Welcome</label>
            <div id="prev-welcome" class="preview-box"></div>
            
            <label style="margin-top: 15px;">Preview: OnMeeting</label>
            <div id="prev-meeting" class="preview-box"></div>

            <label style="margin-top: 15px;">Preview: Help</label>
            <div id="prev-help" class="preview-box" style="height: 300px;"></div>
        </div>

        <!-- Output Panel -->
        <div class="panel full-width">
            <h2>⚙️ Raw Config Export</h2>
            <p style="font-size: 13px; color: #888;">Copy this text directly into your EHR templates config file.</p>
            <textarea id="raw-export" class="raw-output" readonly></textarea>
        </div>
    </div>

    <script>
        // --- UNITY RICH TEXT PARSER ---
        function parseUnityTags(text) {
            if (!text) return "";
            
            let html = text
                // Escape HTML strictly
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                
                // Parse literal \n and real newlines into HTML breaks
                .replace(/\\n/g, "<br>")
                .replace(/\n/g, "<br>")
                
                // Bold, Italics, Underline, Strikethrough
                .replace(/&lt;b&gt;/gi, "<strong>")
                .replace(/&lt;\/b&gt;/gi, "</strong>")
                .replace(/&lt;i&gt;/gi, "<em>")
                .replace(/&lt;\/i&gt;/gi, "</em>")
                .replace(/&lt;u&gt;/gi, '<span style="text-decoration: underline;">')
                .replace(/&lt;\/u&gt;/gi, "</span>")
                .replace(/&lt;s&gt;/gi, '<span style="text-decoration: line-through;">')
                .replace(/&lt;\/s&gt;/gi, "</span>")
                
                // Color parsing (handles hex and basic words)
                .replace(/&lt;color=(#?[A-Za-z0-9]+)&gt;/gi, '<span style="color: $1;">')
                .replace(/&lt;\/color&gt;/gi, "</span>")
                
                // Size parsing
                .replace(/&lt;size=(\d+)(%?)&gt;/gi, (match, val, percentSign) => {
                    return `<span style="font-size: ${val}${percentSign ? '%' : 'px'};">`;
                })
                .replace(/&lt;\/size&gt;/gi, "</span>");

            return html;
        }

        // --- GRADIENT LOGIC ---
        function hexToRgb(hex) {
            let bigint = parseInt(hex.replace("#", ""), 16);
            return [(bigint >> 16) & 255, (bigint >> 8) & 255, bigint & 255];
        }

        function rgbToHex(r, g, b) {
            return "#" + (1 << 24 | r << 16 | g << 8 | b).toString(16).slice(1).toUpperCase();
        }

        function generateGradient() {
            let text = document.getElementById('grad-text').value;
            let c1 = document.getElementById('grad-c1').value;
            let c2 = document.getElementById('grad-c2').value;
            let isBold = document.getElementById('grad-bold').checked;
            let isItalic = document.getElementById('grad-italic').checked;
            let size = document.getElementById('grad-size').value.trim();
            let output = document.getElementById('grad-output');
            
            if(!text) { output.value = ""; return; }

            // Strip existing tags so we don't accidentally gradientize brackets
            let cleanText = text.replace(/<[^>]*>/g, '');
            let len = cleanText.length;
            
            let rgb1 = hexToRgb(c1);
            let rgb2 = hexToRgb(c2);
            let result = "";

            for(let i = 0; i < len; i++) {
                if(cleanText[i] === ' ') {
                    result += ' ';
                    continue;
                }
                let ratio = len > 1 ? i / (len - 1) : 0;
                let r = Math.round(rgb1[0] + (rgb2[0] - rgb1[0]) * ratio);
                let g = Math.round(rgb1[1] + (rgb2[1] - rgb1[1]) * ratio);
                let b = Math.round(rgb1[2] + (rgb2[2] - rgb1[2]) * ratio);
                
                result += `<color=${rgbToHex(r,g,b)}>${cleanText[i]}</color>`;
            }
            
            // Apply wrappers
            if (isBold) result = `<b>${result}</b>`;
            if (isItalic) result = `<i>${result}</i>`;
            if (size) result = `<size=${size}>${result}</size>`;
            
            output.value = result;
            output.select();
        }

        // --- SYNC & RENDER LOGIC ---
        function updateAll() {
            const keys = ['welcome', 'meeting', 'help'];
            let rawConfigStr = "";

            keys.forEach(key => {
                let rawText = document.getElementById(`val-${key}`).value;
                
                // Update Live Preview
                document.getElementById(`prev-${key}`).innerHTML = parseUnityTags(rawText);
                
                let configFormatted = rawText.replace(/\n/g, '\\n').replace(/\\n\\n/g, '\\n');
                let configKey = key === 'meeting' ? 'OnMeeting' : key;
                rawConfigStr += `${configKey}:${configFormatted}\n`;
            });

            document.getElementById('raw-export').value = rawConfigStr.trim();
        }

        // Init on load
        window.onload = updateAll;
    </script>
</body>
</html>
